services:
  - type: web
    name: vtiu-online
    env: python
    plan: starter
    buildCommand: pip install --break-system-packages -r requirements.txt && playwright install chromium
    startCommand: python -m flask --app app db upgrade && gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 60 --max-requests 50 --max-requests-jitter 5 --preload --log-level info
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        value: ""
      - key: DATABASE_URL
        value: ""
      - key: FLASK_ENV
        value: "production"
      - key: MAIL_USERNAME
        value: ""
      - key: MAIL_PASSWORD
        value: ""
      - key: ZOOM_ACCOUNT_ID
        value: ""
      - key: ZOOM_CLIENT_ID
        value: ""
      - key: ZOOM_CLIENT_SECRET
        value: ""
      - key: SENTRY_DSN
        value: ""
